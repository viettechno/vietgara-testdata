  - { user: accountant1-1, garage: gara1-1, group: Accountant }
  - { user: advisor1-1, garage: gara1-1, group: Service Advisor }
  - { user: technician1-1, garage: gara1-1, group: Technician }
  - { user: technician1-1, garage: gara1-2, group: Technician }
  - { user: inventory1-1, garage: gara1-1, group: Inventory Staff }
